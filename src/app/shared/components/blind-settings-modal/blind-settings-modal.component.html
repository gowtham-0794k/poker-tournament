<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismissModal()" fill="clear">
        <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-no-padding">Tournament Settings</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="resetModal()" fill="clear">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content class="ion-no-padding">
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-input
              type="number"
              label="Small Blind"
              placeholder="Enter small blind"
              labelPlacement="floating"
              [clearInput]="true"
              [(ngModel)]="smallBlind"
              [disabled]="canModifySettings"
            >
            </ion-input>
          </ion-col>
          <ion-col size="6">
            <ion-input
              type="number"
              label="Blinds Increment"
              placeholder="Enter blinds increment"
              labelPlacement="floating"
              [clearInput]="true"
              [(ngModel)]="blindsIncrement"
              [disabled]="canModifySettings"
            >
            </ion-input>
          </ion-col>
          <ion-col size="6">
            <ion-input
              type="number"
              label="Duration (minutes)"
              placeholder="Enter duration"
              labelPlacement="floating"
              [clearInput]="true"
              [(ngModel)]="duration"
              [disabled]="canModifySettings"
            >
            </ion-input>
          </ion-col>
          <ion-col size="6">
            <ion-input
              type="number"
              label="Number of Levels"
              placeholder="Enter levels"
              labelPlacement="floating"
              [clearInput]="true"
              [(ngModel)]="levels"
              [disabled]="canModifySettings"
            >
            </ion-input>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
