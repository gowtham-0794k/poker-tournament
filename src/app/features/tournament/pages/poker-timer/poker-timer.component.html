<app-header />
<app-side-bar />

<ion-content [fullscreen]="true" class="ion-padding-top">
  <!-- Main content area -->
  <div class="content-area">
    <!-- Timer Display -->
    <ion-card>
      <ion-card-content>
        <div class="timer-display">
          <h1>{{ getFormattedTime() }}</h1>
          <ion-progress-bar
            [value]="getProgressPercentage() / 100"
            [color]="
              getProgressPercentage() > 90
                ? 'danger'
                : getProgressPercentage() > 80
                ? 'warning'
                : 'success'
            "
          >
          </ion-progress-bar>
        </div>
      </ion-card-content>
    </ion-card>
    <ion-card class="blinds-card">
      <ion-card-content class="card-content">
        <div class="left-section">
          <div class="blinds-icon">{{ timerState.currentLevel }}</div>
          <div class="blinds-info">
            <p class="blinds-name">Blinds</p>
            <span class="blinds-symbol">Ante</span>
          </div>
        </div>
        <div class="right-section">
          <p class="blinds-price">
            {{ timerState.currentSmallBlind }}/{{ timerState.currentBigBlind }}
          </p>
          <span class="blinds-change">
            <ion-toggle
              [(ngModel)]="anteEnabled"
              slot="start"
              (ionChange)="toggleAnte()"
            />
          </span>
        </div>
      </ion-card-content>
    </ion-card>
    <ion-card class="big-blind-card">
      <ion-card-content class="card-content">
        <div class="left-section">
          <div class="big-blind-info">
            <ion-input
              type="number"
              label="Your Stack"
              [(ngModel)]="stackSize"
              placeholder="Enter stack size"
              labelPlacement="stacked"
              (ionChange)="calculateBigBlindsLeft()"
            >
            </ion-input>
          </div>
        </div>
        <div class="right-section">
          <ion-button
            expand="block"
            color="secondary big-blind-change"
            (click)="calculateBigBlindsLeft()"
          >
            BB Left - {{ bigBlindsLeft }}
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
    <ion-card>
      <ion-card-content>
        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="4">
              <ion-label position="stacked">Level</ion-label>
              <ion-input
                type="number"
                [(ngModel)]="syncLevel"
                placeholder="Enter level"
                min="1"
                [max]="timerState.totalLevels"
              >
              </ion-input>
            </ion-col>
            <ion-col size="5">
              <ion-label position="stacked">Time (mm:ss)</ion-label>
              <ion-input
                [(ngModel)]="syncTime"
                placeholder="Enter time"
                maxlength="5"
              >
              </ion-input>
            </ion-col>
            <ion-col size="3" class="ion-align-self-center">
              <ion-button
                expand="block"
                color="tertiary"
                (click)="syncTimer()"
                [disabled]="!isValidSync()"
                class="sync-button"
              >
                <ion-icon name="sync" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Sticky Bottom Card -->
  <div class="sticky-bottom">
    <!-- Action Buttons -->
    <ion-grid>
      <ion-row>
        <ion-col size="3">
          <ion-button
            expand="block"
            color="success"
            (click)="startTimer()"
            [disabled]="
              !isValidInput() || (timerState.isRunning && !timerState.isPaused)
            "
          >
            <ion-icon name="play" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-col>

        <ion-col size="3">
          <ion-button
            expand="block"
            color="warning"
            (click)="pauseTimer()"
            [disabled]="!timerState.isRunning"
          >
            <ion-icon name="pause" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col size="3">
          <ion-button
            expand="block"
            color="secondary"
            (click)="openLevelSchedulesModal()"
          >
            <ion-icon name="layers-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Floating Action Button -->
  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    size="small"
    color="primary"
  >
    <ion-fab-button (click)="openTournamentSettingModal()">
      <ion-icon name="settings-outline" color="white"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
